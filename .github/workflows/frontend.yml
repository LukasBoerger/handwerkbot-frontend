name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/kommuvo-frontend/browser
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/kommuvo-frontend/browser

      - name: Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          start: npx serve -s dist/kommuvo-frontend/browser -l 4200
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 60
          browser: chrome

      - name: Screenshots bei Fehler hochladen
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
