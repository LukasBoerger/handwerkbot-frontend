<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">Kommuvo</div>
    <div class="auth-brand-line"></div>
    <h1 class="auth-title">Willkommen zurück</h1>
    <p class="auth-subtitle">Melden Sie sich in Ihrem Konto an</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (error) {
        <div class="error-banner">
          <mat-icon>error</mat-icon>
          {{ error }}
        </div>
      }

      <div class="field">
        <label class="field-label" for="login-email">E-Mail</label>
        <input
          id="login-email"
          class="field-input"
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="name@betrieb.de"
          data-cy="input-email"
        >
      </div>

      <div class="field">
        <label class="field-label" for="login-password">Passwort</label>
        <div class="field-input-wrap">
          <input
            id="login-password"
            class="field-input"
            formControlName="password"
            [type]="hidePassword ? 'password' : 'text'"
            autocomplete="current-password"
            placeholder="••••••••"
            data-cy="input-password"
          >
          <button
            type="button"
            class="field-toggle"
            (click)="hidePassword = !hidePassword"
            aria-label="Passwort anzeigen umschalten"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <p class="forgot-link">
        <a routerLink="/forgot-password">Passwort vergessen?</a>
      </p>

      <button
        class="btn-primary"
        type="submit"
        data-cy="btn-login"
        [disabled]="form.invalid || loading"
      >
        @if (loading) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Anmelden →
        }
      </button>

      <div class="demo-hint">
        Oder testen Sie ohne Registrierung:
        <button type="button" data-cy="btn-demo" (click)="fillDemo()">Demo ausprobieren →</button>
      </div>
    </form>

    <hr class="divider">
    <p class="auth-footer">
      Noch kein Konto? <a routerLink="/register">Jetzt registrieren</a>
    </p>
  </div>
</div>
