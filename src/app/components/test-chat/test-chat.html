<div class="chat-widget">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header__avatar">🤖</div>
    <div class="chat-header__info">
      <span class="chat-header__name">Dein KI-Assistent</span>
      <span class="chat-header__status">● Online</span>
    </div>
    <span class="chat-header__hint">Testnachrichten werden nicht gespeichert</span>
  </div>

  <!-- Messages -->
  <div class="chat-messages" data-cy="chat-messages">
    @for (msg of messages; track $index) {
      <div class="bubble-row" [class.bubble-row--user]="msg.role === 'user'">
        <div class="bubble" [class.bubble--user]="msg.role === 'user'" [class.bubble--bot]="msg.role === 'bot'">
          <span class="bubble__text">{{ msg.text }}</span>
          <span class="bubble__time">{{ msg.time }}</span>
        </div>
      </div>
    }

    @if (typing) {
      <div class="bubble-row">
        <div class="bubble bubble--bot bubble--typing">
          <span class="typing-dots">
            <span></span><span></span><span></span>
          </span>
          <span class="bubble__time">Bot tippt...</span>
        </div>
      </div>
    }

    <div #messagesEnd></div>
  </div>

  <!-- Zugang gesperrt -->
  @if (blocked) {
    <div class="chat-blocked" data-cy="chat-blocked" role="alert">
      <div class="chat-blocked__icon">🔒</div>
      <div class="chat-blocked__body">
        <span class="chat-blocked__title">{{ blockTitle }}</span>
        <span class="chat-blocked__text">{{ blockMessage }}</span>
        <a class="chat-blocked__action" routerLink="/pricing">Jetzt abonnieren →</a>
      </div>
    </div>
  }

  <!-- Input -->
  <div class="chat-input">
    <input
      class="chat-input__field"
      data-cy="chat-input"
      type="text"
      [placeholder]="blocked ? 'Zugang nicht aktiv' : 'Nachricht schreiben...'"
      [(ngModel)]="inputText"
      (keydown)="onKeydown($event)"
      [disabled]="typing || blocked"
      autocomplete="off">
    <button
      class="chat-input__send"
      data-cy="chat-send"
      (click)="send()"
      [disabled]="!inputText.trim() || typing || blocked"
      title="Senden">
      ➤
    </button>
  </div>

</div>
